[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "tracetrim"
version = "0.6.0"
description = "Learn which fields of tool outputs an agent visibly reuses, from its traces, and trim the rest."
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Alessio Pomaro" }]
license = "MIT"
license-files = ["LICENSE", "LICENSES.md"]
keywords = ["agents", "mcp", "llm", "tool outputs", "token", "telemetry"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Operating System :: OS Independent",
]
dependencies = []

[project.optional-dependencies]
# Token counts are measured, never estimated: `measure` needs a real tokenizer.
measure = ["tiktoken>=0.7"]
test = ["pytest>=8", "tiktoken>=0.7", "pyyaml>=6"]
proxy = ["mcp>=2.3"]
# Experimental, heavy (torch): see tracetrim.structural.headroom.
headroom = ["headroom-ai>=0.39"]

[project.urls]
Homepage = "https://www.alessiopomaro.it/"
Repository = "https://github.com/alepom/tracetrim"
Paper = "https://doi.org/10.5281/zenodo.23953934"
"Software DOI" = "https://doi.org/10.5281/zenodo.23954125"
Changelog = "https://github.com/alepom/tracetrim/blob/master/CHANGELOG.md"

[project.scripts]
tracetrim = "tracetrim.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
tracetrim = ["skills/*/*.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
