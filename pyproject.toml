[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tracetrim"
version = "0.3.2"
description = "Learn which fields of tool outputs an agent actually uses, from its traces, and trim the rest."
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Alessio Pomaro" }]
dependencies = []

[project.optional-dependencies]
# Token counts are measured, never estimated: `measure` needs a real tokenizer.
measure = ["tiktoken>=0.7"]
test = ["pytest>=8", "tiktoken>=0.7"]
proxy = ["mcp>=2.3"]
# Experimental, heavy (torch): see tracetrim.structural.headroom.
headroom = ["headroom-ai>=0.39"]

[project.urls]
Homepage = "https://www.alessiopomaro.it/"

[project.scripts]
tracetrim = "tracetrim.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
